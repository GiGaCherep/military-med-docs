<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Уведомления — Military Med Docs</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
    <div class="topbar">
        <h1>Уведомления</h1>
        <div class="user-info">
            <a href="/dashboard" class="btn btn-secondary">На главную</a>
            <form action="/notifications/read-all" method="post" class="inline-form">
                <button type="submit" class="btn btn-primary">Прочитать все</button>
            </form>
        </div>
    </div>

    {% if not items %}
        <div class="card"><p class="muted">Уведомлений нет.</p></div>
    {% else %}
        {% for n in items %}
        <div class="card notification-item {% if not n.is_read %}unread{% endif %}">
            <p style="margin: 0 0 0.4rem;">{{ n.message }}</p>
            <p class="muted" style="margin: 0;">
                {{ n.created_at.strftime('%d.%m.%Y %H:%M') }}
                {% if n.document_id %}
                    · <a href="/documents/{{ n.document_id }}">Открыть документ</a>
                {% endif %}
                {% if not n.is_read %}
                    · <form action="/notifications/{{ n.id }}/read" method="post" class="inline-form">
                        <button type="submit" class="btn btn-secondary btn-small">Отметить прочитанным</button>
                      </form>
                {% endif %}
            </p>
        </div>
        {% endfor %}
    {% endif %}
</div>
</body>
</html>
