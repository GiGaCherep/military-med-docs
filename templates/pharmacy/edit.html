<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактирование {{ med.name }} — Аптека</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container-narrow">
    <div class="topbar">
        <h1>Редактировать препарат</h1>
        <a href="/pharmacy/{{ med.id }}" class="btn btn-secondary">Отмена</a>
    </div>

    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}

    <form class="card" action="/pharmacy/{{ med.id }}/edit" method="post">
        <div class="field-row">
            <div class="field">
                <label for="name">Название *</label>
                <input type="text" id="name" name="name" value="{{ med.name }}" required>
            </div>
            <div class="field">
                <label for="dosage">Дозировка</label>
                <input type="text" id="dosage" name="dosage" value="{{ med.dosage or '' }}" placeholder="500 мг">
            </div>
        </div>

        <div class="field-row">
            <div class="field">
                <label for="form">Форма выпуска</label>
                <input type="text" id="form" name="form" value="{{ med.form or '' }}" placeholder="Таблетки, ампулы...">
            </div>
            <div class="field">
                <label for="category_id">Группа (Тег)</label>
                <select id="category_id" name="category_id">
                    <option value="">— без группы —</option>
                    {% for c in categories %}
                        <option value="{{ c.id }}" {% if med.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="field">
            <label for="location_id">Место хранения</label>
            <select id="location_id" name="location_id">
                <option value="">— не указано —</option>
                {% for l in locations %}
                    <option value="{{ l.id }}" {% if med.location_id == l.id %}selected{% endif %}>{{ l.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="field">
            <label for="description">Краткое описание / Заметки врача</label>
            <textarea id="description" name="description" rows="2">{{ med.description or '' }}</textarea>
        </div>

        <hr style="margin: 1.5rem 0; border: none; border-top: 1px solid #eee;">
        <p class="muted" style="margin-bottom: 1rem;">Медицинская информация:</p>

        <div class="field">
            <label for="indications">Показания к применению</label>
            <textarea id="indications" name="indications" rows="3">{{ med.indications or '' }}</textarea>
        </div>

        <div class="field">
            <label for="contraindications">Противопоказания</label>
            <textarea id="contraindications" name="contraindications" rows="2">{{ med.contraindications or '' }}</textarea>
        </div>

        <div class="field">
            <label for="interactions">Лекарственные взаимодействия (конфликты)</label>
            <textarea id="interactions" name="interactions" rows="2" style="border-color: #f5b7b1;">{{ med.interactions or '' }}</textarea>
        </div>

        <div class="field">
            <label for="side_effects">Побочные эффекты</label>
            <textarea id="side_effects" name="side_effects" rows="2">{{ med.side_effects or '' }}</textarea>
        </div>

        <div class="edit-actions">
            <button type="submit" class="btn btn-primary">Сохранить изменения</button>
            <a href="/pharmacy/{{ med.id }}" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>
</body>
</html>
